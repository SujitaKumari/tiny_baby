<script>
document.addEventListener('DOMContentLoaded', function() {
    const observer = new MutationObserver((mutations) => {
      mutations.forEach((mutation) => {
        mutation.addedNodes.forEach((node) => {
          if (node.nodeType === 1) {
            if (node.classList && node.classList.contains('wk-image')) {
              node.src = 'Tiny-images/Images/baby-1.webp';
              node.srcset = '';
            }
            if (node.querySelectorAll) {
                const images = node.querySelectorAll('.wk-image');
                images.forEach(img => {
                  img.src = 'Tiny-images/Images/baby-1.webp';
                  img.srcset = '';
                });
            }
          }
        });
      });
    });
    observer.observe(document.body, { childList: true, subtree: true });
    
    // Initial check in case they are already in the DOM
    const existingImages = document.querySelectorAll('.wk-image');
    existingImages.forEach(img => {
      img.src = 'Tiny-images/Images/baby-1.webp';
      img.srcset = '';
    });
});
</script>
